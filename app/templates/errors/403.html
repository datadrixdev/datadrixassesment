{% extends "base.html" %}
{% block title %}Access Denied (403) - {{ app_name }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-clean p-5 mx-auto" style="max-width: 540px;">
    <i class="bi bi-shield-x text-danger display-3 mb-3"></i>
    <h3 class="fw-bold text-dark">Access Forbidden</h3>
    <p class="text-muted mb-4">You do not have permission to access or view this assessment session. Candidate sessions are strictly isolated.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">Return to Home</a>
  </div>
</div>
{% endblock %}
