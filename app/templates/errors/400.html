{% extends "base.html" %}
{% block title %}Bad Request (400) - {{ app_name }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-clean p-5 mx-auto" style="max-width: 540px;">
    <i class="bi bi-exclamation-triangle-fill text-warning display-3 mb-3"></i>
    <h3 class="fw-bold text-dark">Invalid Request</h3>
    <p class="text-muted mb-4">{{ error or "The request could not be processed due to invalid parameters or expired submission window." }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">Return to Home</a>
  </div>
</div>
{% endblock %}
