{% extends "base.html" %}
{% block title %}Internal Server Error (500) - {{ app_name }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-clean p-5 mx-auto" style="max-width: 540px;">
    <i class="bi bi-server text-danger display-3 mb-3"></i>
    <h3 class="fw-bold text-dark">Server Error</h3>
    <p class="text-muted mb-4">An unexpected error occurred while processing your request. Please try again or contact your assessment administrator.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">Return to Home</a>
  </div>
</div>
{% endblock %}
